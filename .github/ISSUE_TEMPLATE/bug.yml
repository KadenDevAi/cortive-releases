name: Bug report
description: Something in Cortive isn't working as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Bug reports are public.** Anyone can read them. Please don't paste anything you saved in Cortive (page text, PDFs, screenshots, transcripts, titles or links), passwords, or other private details. Describe the problem in general terms instead. If you'd rather report privately, use **Report a Problem** in Cortive (Settings → Help), which drafts an email instead.
  - type: input
    id: cortive-version
    attributes:
      label: Cortive version
      description: Shown at the bottom of Cortive's Settings, for example "Cortive 0.2.0".
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu → About This Mac, for example "macOS 15.1".
      placeholder: "macOS 15.1"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac chip
      description: Apple menu → About This Mac, next to "Chip".
      options:
        - M1 family (M1, M1 Pro, Max or Ultra)
        - M2 family
        - M3 family
        - M4 family
        - M5 family
        - Intel (Cortive needs Apple silicon)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, step by step, and what went wrong. Error messages help, as long as they don't contain your saved content.
      placeholder: |
        1. Opened Cortive
        2. Clicked ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
